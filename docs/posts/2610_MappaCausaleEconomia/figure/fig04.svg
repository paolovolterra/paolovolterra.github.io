  <title>blockdiag</title>
  <desc>blockdiag nowcast {
  orientation = portrait;
  default_fontsize = 13;
  node_width = 230;
  node_height = 64;

  capacita [label = "Bisogni e capacità di spesa", color = "#d9eee7"];
  domanda [label = "Domanda finale", color = "#fff1cc"];
  vendite [label = "Vendite e investimenti attesi", color = "#fff1cc"];
  domcredito [label = "Domanda di credito", color = "#e8f1f8"];
  offerta [label = "Offerta bancaria e tassi", color = "#e8f1f8"];
  credito [label = "Credito erogato", color = "#e8f1f8"];
  produzione [label = "Produzione e investimenti", color = "#f5d6d6"];
  esiti [label = "Reddito · rischio · PIL", color = "#ded8ef"];

  capacita -&gt; domanda -&gt; vendite -&gt; domcredito -&gt; credito -&gt; produzione -&gt; esiti;
  offerta -&gt; credito;
}
</desc>
