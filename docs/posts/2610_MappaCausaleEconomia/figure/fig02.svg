  <title>blockdiag</title>
  <desc>blockdiag agenda {
  orientation = portrait;
  default_fontsize = 13;
  node_width = 270;
  node_height = 76;

  base [label = "Base recente\nreddito · prezzi · fiducia\nspesa · produzione · lavoro", color = "#d9eee7"];
  imprese [label = "Credito e imprese\nprestiti · tassi · aspettative\nIta-coin", color = "#d9eee7"];

  t12 [label = "13–14 ottobre\nturismo e produzione UE", color = "#e8f1f8"];
  t34 [label = "15–16 ottobre\nprezzi e commercio estero", color = "#e8f1f8"];
  t56 [label = "20 ottobre\ncostruzioni e bilancia pagamenti", color = "#e8f1f8"];
  t78 [label = "27–28 ottobre\ncredito, fatturato e prezzi produzione", color = "#fff1cc"];
  t9 [label = "29 ottobre\nlavoro · fiducia · extra-UE", color = "#fff1cc"];
  t10 [label = "29–30 ottobre\nPIL T3 e inflazione flash", color = "#f5d6d6"];
  esito [label = "Valutazione\nsorpresa · revisione · nowcast\nstato degli archi", color = "#ded8ef"];

  base -&gt; t12;
  imprese -&gt; t12;
  base -&gt; t34;
  imprese -&gt; t34;
  t12 -&gt; t56;
  t34 -&gt; t56;
  t56 -&gt; t78 -&gt; t9 -&gt; t10 -&gt; esito;
}
</desc>
